<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200">

  <defs>
    <!-- Colors from image 1 -->
    <!-- Red: #D62B1F, Blue: #1565C0, Yellow: #F9A825, Green: #2E7D32 -->

    <!-- Clip paths for each letter region -->
    <!-- W occupies roughly x:5 to x:100 -->
    <clipPath id="cW">
      <rect x="5" y="0" width="95" height="165"/>
    </clipPath>
    <!-- E1 occupies roughly x:100 to x:170 -->
    <clipPath id="cE1">
      <rect x="100" y="0" width="70" height="165"/>
    </clipPath>
    <!-- N1 occupies roughly x:170 to x:248 -->
    <clipPath id="cN1">
      <rect x="170" y="0" width="78" height="165"/>
    </clipPath>
    <!-- N2 occupies roughly x:248 to x:326 -->
    <clipPath id="cN2">
      <rect x="248" y="0" width="78" height="165"/>
    </clipPath>
    <!-- O occupies roughly x:326 to x:418 -->
    <clipPath id="cO">
      <rect x="326" y="0" width="92" height="165"/>
    </clipPath>
    <!-- V occupies roughly x:418 to x:498 -->
    <clipPath id="cV">
      <rect x="418" y="0" width="80" height="165"/>
    </clipPath>
    <!-- A occupies roughly x:498 to x:578 -->
    <clipPath id="cA">
      <rect x="498" y="0" width="80" height="165"/>
    </clipPath>
    <!-- T occupies roughly x:578 to x:650 -->
    <clipPath id="cT">
      <rect x="578" y="0" width="72" height="165"/>
    </clipPath>
    <!-- E2 occupies roughly x:650 to x:720 -->
    <clipPath id="cE2">
      <rect x="650" y="0" width="70" height="165"/>
    </clipPath>

    <!-- Full text clip for whole word -->
    <clipPath id="clipAll">
      <text x="5" y="145"
        font-family="'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif"
        font-weight="500"
        font-size="148"
        letter-spacing="2">WENNOVATE</text>
    </clipPath>
  </defs>

  <!-- White background -->
  <rect width="760" height="200" fill="white"/>

  <!-- =========================================================== -->
  <!-- Step 1: Draw colored lines CLIPPED to the letter shapes     -->
  <!-- =========================================================== -->

  <!-- W - RED diagonal line (left diagonal going down-right) -->
  <line x1="28" y1="0" x2="28" y2="165"
        stroke="#D62B1F" stroke-width="4.5"
        clip-path="url(#clipAll)"/>

  <!-- E (first) - BLUE horizontal bars (top and middle) -->
  <line x1="100" y1="38" x2="175" y2="38"
        stroke="#1565C0" stroke-width="4.5"
        clip-path="url(#clipAll)"/>

  <!-- N (first) - YELLOW vertical bar (right side of N) -->
  <line x1="240" y1="0" x2="240" y2="165"
        stroke="#F9A825" stroke-width="4.5"
        clip-path="url(#clipAll)"/>

  <!-- N (second) - GREEN vertical bar -->
  <line x1="320" y1="0" x2="320" y2="165"
        stroke="#2E7D32" stroke-width="4.5"
        clip-path="url(#clipAll)"/>

  <!-- O - BLUE partial arc / circle inside O -->
  <circle cx="372" cy="80" r="44"
        fill="none" stroke="#1565C0" stroke-width="4.5"
        stroke-dasharray="80 200"
        stroke-dashoffset="-40"
        clip-path="url(#clipAll)"/>

  <!-- V - GREEN diagonal bar -->
  <line x1="455" y1="0" x2="455" y2="165"
        stroke="#2E7D32" stroke-width="4.5"
        clip-path="url(#clipAll)"/>

  <!-- A - RED horizontal crossbar through middle -->
  <line x1="498" y1="95" x2="580" y2="95"
        stroke="#D62B1F" stroke-width="4.5"
        clip-path="url(#clipAll)"/>

  <!-- T - BLUE top horizontal bar -->
  <line x1="578" y1="22" x2="652" y2="22"
        stroke="#1565C0" stroke-width="4.5"
        clip-path="url(#clipAll)"/>

  <!-- E (second) - RED top bar, BLUE middle bar -->
  <line x1="650" y1="38" x2="725" y2="38"
        stroke="#D62B1F" stroke-width="4.5"
        clip-path="url(#clipAll)"/>
  <line x1="650" y1="82" x2="710" y2="82"
        stroke="#1565C0" stroke-width="4.5"
        clip-path="url(#clipAll)"/>

  <!-- =========================================================== -->
  <!-- Step 2: Draw the outlined letter text on top                -->
  <!-- =========================================================== -->
  <text x="5" y="145"
        font-family="'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif"
        font-weight="500"
        font-size="148"
        letter-spacing="2"
        fill="none"
        stroke="#1a1a1a"
        stroke-width="2.5"
        paint-order="stroke fill">WENNOVATE</text>

  <!-- =========================================================== -->
  <!-- Step 3: Tagline                                             -->
  <!-- =========================================================== -->
  <text x="370" y="185"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="20"
        fill="#1a1a1a"
        text-anchor="middle"
        letter-spacing="1.5">System  |  Strategy  |  Sustainability</text>
</svg>
